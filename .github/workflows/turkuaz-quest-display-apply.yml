# Dosya Yolu: /ROenglishRE/.github/workflows/turkuaz-quest-display-apply.yml
# Amac: Quest ID bazli Turkce patchleri legacy byte yapisini koruyarak questid2display.txt dosyasina uygular
# Modul: Tool - YAML
# Version: 1.2.0
# Aciklama: Patch kaynagi veya uygulayici degistiginde dosyayi yeniden uretir, dogrular ve translation/tr dalina commit eder
# Bagimli Oldugu Katman: Tool

name: Turkuaz Quest Display Apply

on:
  workflow_dispatch:

  push:
    branches:
      - "translation/tr"
    paths:
      - "TurkuazTR/questid2display.tr.json"
      - "Tools/apply_questid2display_translation.py"
      - "Tools/validate_questid2display_translation.py"
      - ".github/workflows/turkuaz-quest-display-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: translation/tr

      - name: Fetch upstream source ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin             '+refs/heads/upstream/latest:refs/remotes/origin/upstream/latest'

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             Tools/apply_questid2display_translation.py             Tools/validate_questid2display_translation.py             Tools/export_questid2display_candidates.py

      - name: Apply quest display patches
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/apply_questid2display_translation.py             --source-ref refs/remotes/origin/upstream/latest

      - name: Validate generated quest display
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_questid2display_translation.py             --working-tree             --upstream-ref refs/remotes/origin/upstream/latest

      - name: Export pending quest candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/export_questid2display_candidates.py             --source-ref refs/remotes/origin/upstream/latest

      - name: Commit generated quest display
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- Translation/Renewal/data/questid2display.txt TurkuazTR/questid2display.pending.json)" ]; then
            echo "Quest display and pending report already up to date."
            exit 0
          fi

          git config user.name "Turkuaz Translation Bot"
          git config user.email "turkuaz-translation-bot@users.noreply.github.com"

          git add Translation/Renewal/data/questid2display.txt TurkuazTR/questid2display.pending.json
          git commit -m "chore: apply Turkish quest display patches"
          git push origin HEAD:translation/tr
