# 📄 Dosya Yolu: /ROenglishRE/.github/workflows/turkuaz-quest-display-apply.yml
# 📌 Amac: Quest patch kaynagindan questid2display ve OngoingQuests generated dosyalarini tek atomik commit ile uretir
# 📌 Tool - YAML
# Version: 2.0.0
# Aciklama: Legacy byte yapisini korur, quest display ile Ongoing Title/Summary cevirilerini dogrular ve birlikte commit eder
# Bagimli Oldugu Katman: Tool

name: Turkuaz Translation Generated Apply

on:
  workflow_dispatch:

  push:
    branches:
      - "translation/tr"
    paths:
      - "TurkuazTR/questid2display.tr.json"
      - "Tools/apply_questid2display_translation.py"
      - "Tools/validate_questid2display_translation.py"
      - "Tools/export_questid2display_candidates.py"
      - "Tools/apply_ongoingquests_translation.py"
      - "Tools/validate_ongoingquests_translation.py"
      - ".gitattributes"
      - ".github/workflows/turkuaz-quest-display-apply.yml"

permissions:
  contents: write

concurrency:
  group: turkuaz-translation-generated-apply-translation-tr
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: translation/tr

      - name: Fetch upstream source ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/upstream/latest:refs/remotes/origin/upstream/latest'

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Tools/apply_questid2display_translation.py \
            Tools/validate_questid2display_translation.py \
            Tools/export_questid2display_candidates.py \
            Tools/apply_ongoingquests_translation.py \
            Tools/validate_ongoingquests_translation.py

      - name: Verify generated file Git attributes
        shell: bash
        run: |
          set -euo pipefail

          quest_attr="$(git check-attr text -- Translation/Renewal/data/questid2display.txt)"
          ongoing_attr="$(git check-attr text -- Translation/Renewal/SystemEN/OngoingQuests.lub)"

          echo "$quest_attr"
          echo "$ongoing_attr"

          printf '%s\n' "$quest_attr" | grep -Fq ': text: unset'
          printf '%s\n' "$ongoing_attr" | grep -Fq ': text: unset'

      - name: Apply quest display patches
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/apply_questid2display_translation.py \
            --source-ref refs/remotes/origin/upstream/latest

      - name: Validate generated quest display
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_questid2display_translation.py \
            --working-tree \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Export pending quest candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/export_questid2display_candidates.py \
            --source-ref refs/remotes/origin/upstream/latest

      - name: Apply OngoingQuests Title and Summary patches
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/apply_ongoingquests_translation.py \
            --source-ref refs/remotes/origin/upstream/latest

      - name: Validate generated OngoingQuests
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_ongoingquests_translation.py \
            --working-tree \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Commit generated translation files
        shell: bash
        run: |
          set -euo pipefail

          generated_files=(
            "Translation/Renewal/data/questid2display.txt"
            "TurkuazTR/questid2display.pending.json"
            "Translation/Renewal/SystemEN/OngoingQuests.lub"
          )

          if [ -z "$(git status --porcelain -- "${generated_files[@]}")" ]; then
            echo "Generated translation files already up to date."
            exit 0
          fi

          git config user.name "Turkuaz Translation Bot"
          git config user.email "turkuaz-translation-bot@users.noreply.github.com"

          git add -- "${generated_files[@]}"
          git commit -m "chore: apply generated Turkish quest translations"
          git push origin HEAD:translation/tr
