# PATH: /ROenglishRE/.github/workflows/turkuaz-skill-translation.yml
# PURPOSE: Skill, line-overlay ve whole-file localization ciktilarini English/Hybrid/Full TR/Bilingual profillerinde dogrular.
# MODULE-FILETYPE: CI - GitHub Actions YAML
# VERSION: 2.8.0
# DESCRIPTION: Tum exact shard ve pending batch config degisikliklerinde deterministik tum sayfalari yeniler.
# DEPENDENCY-LAYER: Tool

name: Turkuaz Skill Translation

on:
  push:
    branches:
      - translation/tr
    paths:
      - ".github/workflows/turkuaz-skill-translation.yml"
      - "TurkuazTR/skillinfolist.tr.json"
      - "TurkuazTR/skilldescript.tr.json"
      - "TurkuazTR/skill-profiles.json"
      - "TurkuazTR/localization-profiles.json"
      - "TurkuazTR/config/iteminfo-rules.json"
      - "TurkuazTR/config/iteminfo-inventory.json"
      - "TurkuazTR/config/iteminfo-exact-shards.json"
      - "TurkuazTR/config/iteminfo-exact-*.tr.json"
      - "TurkuazTR/iteminfo-exact.tr.json"
      - "TurkuazTR/iteminfo-lore.source-recovery.json"
      - "TurkuazTR/msgstringtable.tr.json"
      - "TurkuazTR/achievements.tr.json"
      - "TurkuazTR/line-overlays.json"
      - "TurkuazTR/guild_tip.tr.json"
      - "TurkuazTR/tipoftheday.tr.json"
      - "TurkuazTR/file-overlays.json"
      - "TurkuazTR/books/**"
      - "TurkuazTR/navi_data.tr.json"
      - "TurkuazTR/dc_scream.tr.json"
      - "TurkuazTR/ba_frostjoke.tr.json"
      - "TurkuazTR/sign_data.tr.json"
      - "TurkuazTR/towninfo.tr.json"
      - "TurkuazTR/recommended_quests.tr.json"
      - "TurkuazTR/tools/**"
      - "Translation/Renewal/data/luafiles514/lua files/skillinfoz/skillinfolist.lub"
      - "Translation/Renewal/data/luafiles514/lua files/skillinfoz/skilldescript.lub"
      - "Translation/Renewal/data/msgstringtable.txt"
      - "Translation/Renewal/data/GuildTip.txt"
      - "Translation/Renewal/tipoftheday.txt"
      - "Translation/Renewal/data/dc_scream.txt"
      - "Translation/Renewal/data/ba_frostjoke.txt"
      - "Translation/Renewal/SystemEN/achievements.lub"
      - "Translation/Renewal/SystemEN/Navi_Data.lub"
      - "Translation/Renewal/SystemEN/Sign_Data.lub"
      - "Translation/Renewal/SystemEN/Towninfo.lub"
      - "Translation/Renewal/SystemEN/RecommendedQuests.lub"
      - "Translation/Renewal/SystemEN/LuaFiles514/itemInfo.lua"

permissions:
  contents: write

concurrency:
  group: turkuaz-skill-translation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-skill-translation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translation branch
        uses: actions/checkout@v4
        with:
          ref: translation/tr
          fetch-depth: 0

      - name: Fetch upstream source ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/upstream/latest:refs/remotes/origin/upstream/latest'

      - name: Generate skill name pending report
        run: python TurkuazTR/tools/extract-skillinfolist-pending.py

      - name: Generate description pending report
        run: python TurkuazTR/tools/extract-skilldescript-pending.py

      - name: Validate English profile
        run: python TurkuazTR/tools/build-skill-profile.py --profile english

      - name: Validate Hybrid profile
        run: python TurkuazTR/tools/build-skill-profile.py --profile hybrid

      - name: Validate Full TR profile
        run: python TurkuazTR/tools/build-skill-profile.py --profile full_tr

      - name: Validate Bilingual profile
        run: python TurkuazTR/tools/build-skill-profile.py --profile bilingual

      - name: Validate English quest profile
        run: python TurkuazTR/tools/build-quest-profile.py --profile english

      - name: Validate Hybrid quest profile
        run: python TurkuazTR/tools/build-quest-profile.py --profile hybrid

      - name: Validate Full TR quest profile
        run: python TurkuazTR/tools/build-quest-profile.py --profile full_tr

      - name: Validate Bilingual quest profile
        run: python TurkuazTR/tools/build-quest-profile.py --profile bilingual

      - name: Validate registered line overlay profiles
        shell: bash
        run: |
          set -euo pipefail
          components="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("TurkuazTR/line-overlays.json").read_text(encoding="utf-8"))
          print(" ".join(data["components"].keys()))
          PY
          )"
          for component in $components; do
            for profile in english hybrid full_tr bilingual; do
              python TurkuazTR/tools/build-line-overlay-profile.py \
                --component "$component" \
                --profile "$profile"
            done
          done

      - name: Validate registered whole-file overlay profiles
        shell: bash
        run: |
          set -euo pipefail
          components="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("TurkuazTR/file-overlays.json").read_text(encoding="utf-8"))
          print(" ".join(data["components"].keys()))
          PY
          )"
          for component in $components; do
            for profile in english hybrid full_tr bilingual; do
              python TurkuazTR/tools/build-file-overlay-profile.py \
                --component "$component" \
                --profile "$profile"
            done
          done

      - name: Validate itemInfo exact Lua string safety
        run: python3 TurkuazTR/tools/validate-iteminfo-exact-strings.py

      - name: Build localized item info profiles
        shell: bash
        run: |
          set -euo pipefail
          output="TurkuazTR/generated/full_tr/SystemEN/LuaFiles514/itemInfo.lua"
          python TurkuazTR/tools/build-iteminfo-profile.py \
            --profile full_tr \
            --output "$output"

          for profile in hybrid bilingual; do
            target="TurkuazTR/generated/$profile/SystemEN/LuaFiles514/itemInfo.lua"
            mkdir -p "$(dirname "$target")"
            cp "$output" "$target"
            cmp --silent "$output" "$target"
          done

      - name: Generate item info lore pending report
        run: python TurkuazTR/tools/extract-iteminfo-lore-pending.py

      - name: Validate item info pending pages
        run: python3 TurkuazTR/tools/validate-iteminfo-paged-inventory.py

      - name: Synchronize live itemInfo manifest metrics
        shell: bash
        run: |
          set -euo pipefail
          python TurkuazTR/tools/sync-iteminfo-manifest.py
          python TurkuazTR/tools/sync-iteminfo-manifest.py --check

      - name: Commit refreshed localization outputs
        shell: bash
        run: |
          git config user.name "Turkuaz Translation Bot"
          git config user.email "turkuaz-translation-bot@users.noreply.github.com"
          git add TurkuazTR/skillinfolist.pending.json
          git add TurkuazTR/skilldescript.pending.json
          git add TurkuazTR/iteminfo-lore.pending.json
          git add TurkuazTR/iteminfo-lore.batch.json
          if compgen -G "TurkuazTR/iteminfo-lore.batch.*.json" > /dev/null || \
             git ls-files -- "TurkuazTR/iteminfo-lore.batch.*.json" | grep -q .; then
            git add -A -- ':(glob)TurkuazTR/iteminfo-lore.batch.*.json'
          fi
          git add TurkuazTR/manifest.yml
          git add TurkuazTR/generated/english
          git add TurkuazTR/generated/hybrid
          git add TurkuazTR/generated/full_tr
          git add TurkuazTR/generated/bilingual
          git add TurkuazTR/generated/hybrid/SystemEN/LuaFiles514/itemInfo.lua
          git add TurkuazTR/generated/full_tr/SystemEN/LuaFiles514/itemInfo.lua
          git add TurkuazTR/generated/bilingual/SystemEN/LuaFiles514/itemInfo.lua
          if git diff --cached --quiet; then
            echo "Localization pending ve generated ciktilarda degisiklik yok."
            exit 0
          fi
          git commit -m "chore: refresh generated localization profiles"
          git pull --rebase origin translation/tr
          git push origin HEAD:translation/tr
