# 📄 Dosya Yolu: /ROenglishRE/.github/workflows/turkuaz-reviewed-branch-prune.yml
# 📌 Amac: Incelenmis eski dallari commit etiketleriyle koruyup guvenli temizler
# 📌 Modul - Tool YAML
# Version: 1.0.0
# Aciklama: Sabit SHA, ancestor, PR, protection ve arsiv-tag denetimli tek seferlik branch temizligi
# Bagimli Oldugu Katman: Tool

name: Prune Reviewed Legacy Translation Branches

on:
  push:
    branches:
      - translation/tr
    paths:
      - .github/workflows/turkuaz-reviewed-branch-prune.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: roenglishre-reviewed-branch-prune
  cancel-in-progress: false

jobs:
  prune:
    if: github.ref == 'refs/heads/translation/tr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Archive commit and prune only exact approved ancestors
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const repoName = `${owner}/${repo}`;
            const approvals = [
              { branch: 'archive/tr-2025-10-25', sha: 'af2191234a22e180fac62d179489b64f3d17a997', target: 'master' },
              { branch: 'sync/upstream-2026-09', sha: '8367640e3d9139415dca9e03083dc9b8ae60fd33', target: 'translation/tr' },
              { branch: 'test/turkuaztr-2026.10.07-test.1', sha: '082b18f950cb3027b9bc59a9b2a3e9bfec838b64', target: 'translation/tr' },
              { branch: 'release/turkuaztr-2026.10.08-test.2', sha: '1a23d5886f344c0cbc2766607bcb850b4aacfab2', target: 'translation/tr' },
              { branch: 'release/turkuaztr-v1.109.0-test2', sha: 'a8ed8c98430ebfd907ce97d17570131ba4ceeb69', target: 'translation/tr' },
              { branch: 'release/turkuaztr-v1.110.0-test3', sha: 'b278daecebc9ea7b7b92cdc876bba8413faea2dd', target: 'translation/tr' }
            ];
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const retired = [];
            const skipped = [];
            for (const entry of approvals) {
              const activePr = open.some(pr =>
                pr.base.ref === entry.branch ||
                (pr.head.ref === entry.branch && pr.head.repo?.full_name === repoName)
              );
              if (activePr) {
                skipped.push({ branch: entry.branch, why: 'active pull request' });
                continue;
              }
              let current;
              try {
                current = (await github.rest.repos.getBranch({
                  owner, repo, branch: entry.branch
                })).data;
              } catch (err) {
                if (err.status === 404) {
                  skipped.push({ branch: entry.branch, why: 'already absent' });
                  continue;
                }
                throw err;
              }
              if (current.protected || current.commit.sha !== entry.sha) {
                skipped.push({ branch: entry.branch, why: 'protected or changed HEAD' });
                continue;
              }
              const compare = (await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${entry.branch}...${entry.target}`
              })).data;
              if (compare.behind_by !== 0 || !['ahead', 'identical'].includes(compare.status)) {
                skipped.push({ branch: entry.branch, why: 'unmerged or diverged commits' });
                continue;
              }

              const label = entry.branch.replaceAll('/', '--');
              const tag = `branch-archive/2026-10-11/${label}`;
              let tagSha;
              try {
                tagSha = (await github.rest.git.getRef({
                  owner, repo, ref: `tags/${tag}`
                })).data.object.sha;
              } catch (err) {
                if (err.status !== 404) throw err;
                await github.rest.git.createRef({
                  owner, repo, ref: `refs/tags/${tag}`, sha: entry.sha
                });
                tagSha = (await github.rest.git.getRef({
                  owner, repo, ref: `tags/${tag}`
                })).data.object.sha;
              }
              if (tagSha !== entry.sha) {
                skipped.push({ branch: entry.branch, why: 'archive tag points to different commit' });
                continue;
              }

              const latest = (await github.rest.git.getRef({
                owner, repo, ref: `heads/${entry.branch}`
              })).data.object.sha;
              if (latest !== entry.sha) {
                skipped.push({ branch: entry.branch, why: 'HEAD moved after check' });
                continue;
              }
              await github.rest.git.deleteRef({
                owner, repo, ref: `heads/${entry.branch}`
              });
              retired.push({ branch: entry.branch, sha: entry.sha, tag });
            }

            core.info(JSON.stringify({ retired, skipped }));
            await core.summary
              .addHeading('ROenglishRE reviewed branch cleanup')
              .addCodeBlock(JSON.stringify({ retired, skipped }, null, 2), 'json')
              .write();
