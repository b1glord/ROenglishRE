# 📄 Dosya Yolu: /ROenglishRE/.github/workflows/ongoingquests-preview.yml
# 📌 Amac: OngoingQuests.lub legacy dosyasindan guvenli UTF-8 inceleme raporu uretir
# 📌 Tool - YAML
# Version: 1.0.1
# Aciklama: Kaynak legacy dosyayi degistirmez; yalnizca TurkuazTR altinda UTF-8 preview olusturup commit eder
# Bagimli Oldugu Katman: Tool

name: Ongoing Quests Preview

on:
  workflow_dispatch:
    inputs:
      start_line:
        description: "Preview baslangic satiri"
        required: false
        default: "1"
      max_lines:
        description: "Preview satir sayisi"
        required: false
        default: "1200"

  push:
    branches:
      - "translation/tr"
    paths:
      - "Tools/export_ongoingquests_preview.py"
      - ".github/workflows/ongoingquests-preview.yml"

permissions:
  contents: write

concurrency:
  group: ongoingquests-preview-translation-tr
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: translation/tr

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/export_ongoingquests_preview.py

      - name: Export OngoingQuests preview
        shell: bash
        env:
          START_LINE: ${{ inputs.start_line || '1' }}
          MAX_LINES: ${{ inputs.max_lines || '1200' }}
        run: |
          set -euo pipefail
          python3 Tools/export_ongoingquests_preview.py \
            --source-ref HEAD \
            --start-line "$START_LINE" \
            --max-lines "$MAX_LINES"

      - name: Commit preview
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- TurkuazTR/OngoingQuests.preview.txt)" ]; then
            echo "OngoingQuests preview already up to date."
            exit 0
          fi

          git config user.name "Turkuaz Translation Bot"
          git config user.email "turkuaz-translation-bot@users.noreply.github.com"

          git add TurkuazTR/OngoingQuests.preview.txt
          git commit -m "chore: refresh OngoingQuests preview"
          git push origin HEAD:translation/tr
