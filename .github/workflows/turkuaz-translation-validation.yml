# 📄 Dosya Yolu: /ROenglishRE/.github/workflows/turkuaz-translation-validation.yml
# 📌 Amac: Turkce localization takip araclarini ve generated ceviri dosyalarinin byte yapisini CI uzerinde dogrular
# 📌 Tool - YAML
# Version: 1.23.0
# Aciklama: Eski 2025 itemInfo cevirilerinin kurtarma eslesmelerini artifact raporu olarak kaydeder
# Bagimli Oldugu Katman: Tool

name: Turkuaz Translation Validation

on:
  workflow_dispatch:

  push:
    branches:
      - "translation/tr"
    paths:
      - "Translation/**"
      - "TurkuazTR/**"
      - "Tools/turkuaz_translation_status.py"
      - "Tools/validate_achievement_translation.py"
      - "Tools/validate_questid2display_translation.py"
      - "Tools/apply_questid2display_translation.py"
      - "Tools/validate_ongoingquests_translation.py"
      - "Tools/apply_ongoingquests_translation.py"
      - ".github/workflows/turkuaz-translation-validation.yml"
      - ".github/workflows/turkuaz-test-release.yml"

  pull_request:
    paths:
      - "Translation/**"
      - "TurkuazTR/**"
      - "Tools/turkuaz_translation_status.py"
      - "Tools/validate_achievement_translation.py"
      - "Tools/validate_questid2display_translation.py"
      - "Tools/apply_questid2display_translation.py"
      - "Tools/validate_ongoingquests_translation.py"
      - "Tools/apply_ongoingquests_translation.py"
      - ".github/workflows/turkuaz-translation-validation.yml"
      - ".github/workflows/turkuaz-test-release.yml"

concurrency:
  group: turkuaz-translation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch translation refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/upstream/latest:refs/remotes/origin/upstream/latest' \
            '+refs/heads/translation/tr:refs/remotes/origin/translation-tr' \
            '+refs/heads/archive/tr-2025-10-25:refs/remotes/origin/archive-tr-2025-10-25'

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Tools/turkuaz_translation_status.py \
            Tools/validate_achievement_translation.py \
            Tools/validate_questid2display_translation.py \
            Tools/apply_questid2display_translation.py \
            Tools/validate_ongoingquests_translation.py \
            Tools/apply_ongoingquests_translation.py \
            TurkuazTR/tools/build-skill-profile.py \
            TurkuazTR/tools/build-line-overlay-profile.py \
            TurkuazTR/tools/build-file-overlay-profile.py \
            TurkuazTR/tools/build-quest-profile.py \
            TurkuazTR/tools/extract-pettalk-pending.py \
            TurkuazTR/tools/validate-pettalk-recovery.py \
            TurkuazTR/tools/audit-iteminfo-visible.py \
            TurkuazTR/tools/audit-iteminfo-legacy.py \
            TurkuazTR/tools/audit-iteminfo-recovery-context.py \
            TurkuazTR/tools/build-iteminfo-profile.py \
            TurkuazTR/tools/sync-iteminfo-manifest.py \
            TurkuazTR/tools/build-test-package.py \
            TurkuazTR/tools/validate-iteminfo-paged-inventory.py \
            TurkuazTR/tools/extract-skillinfolist-pending.py \
            TurkuazTR/tools/extract-skilldescript-pending.py

      - name: Report translation status
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/turkuaz_translation_status.py \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate pet talk pending inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 TurkuazTR/tools/extract-pettalk-pending.py
          git diff --exit-code -- TurkuazTR/pettalktable.pending.json

      - name: Validate pet talk recovery closure
        shell: bash
        run: |
          set -euo pipefail
          python3 TurkuazTR/tools/validate-pettalk-recovery.py

      - name: Audit visible item info scope
        shell: bash
        run: |
          set -euo pipefail
          python3 TurkuazTR/tools/audit-iteminfo-visible.py --json

      - name: Audit legacy item info recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 TurkuazTR/tools/audit-iteminfo-legacy.py --json \
            --recovery-report "$RUNNER_TEMP/iteminfo-legacy-recovery.json"

      - name: Upload legacy recovery cross-check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteminfo-legacy-recovery-comparison
          path: ${{ runner.temp }}/iteminfo-legacy-recovery.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Audit itemInfo source recovery contexts
        shell: bash
        run: |
          set -euo pipefail
          python3 TurkuazTR/tools/audit-iteminfo-recovery-context.py --output "$RUNNER_TEMP/iteminfo-recovery-context.json"

      - name: Upload itemInfo source recovery context report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteminfo-source-recovery-context
          path: ${{ runner.temp }}/iteminfo-recovery-context.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate itemInfo exact Lua string safety
        run: python3 TurkuazTR/tools/validate-iteminfo-exact-strings.py

      - name: Validate item info translation rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          profiles = json.loads(
              Path("TurkuazTR/localization-profiles.json").read_text(encoding="utf-8")
          )["profiles"]
          expected = {
              "english": "original",
              "hybrid": "tr_metadata",
              "full_tr": "tr_metadata",
              "bilingual": "tr_metadata",
          }
          actual = {
              name: profiles[name]["item_info"]
              for name in expected
          }
          if actual != expected:
              raise SystemExit(
                  f"Unexpected item_info profile modes: {actual!r}"
              )
          PY
          python3 TurkuazTR/tools/build-iteminfo-profile.py \
            --profile english \
            --check
          python3 TurkuazTR/tools/build-iteminfo-profile.py \
            --profile full_tr \
            --output /tmp/turkuaz-iteminfo-full-tr.lua

      - name: Audit translated item info remainder
        shell: bash
        run: |
          set -euo pipefail
          python3 TurkuazTR/tools/audit-iteminfo-visible.py \
            --source /tmp/turkuaz-iteminfo-full-tr.lua \
            --baseline-source Translation/Renewal/SystemEN/LuaFiles514/itemInfo.lua \
            --top 120 \
            --json

      - name: Validate deterministic itemInfo pending pages
        shell: bash
        run: |
          set -euo pipefail
          python3 TurkuazTR/tools/extract-iteminfo-lore-pending.py
          python3 TurkuazTR/tools/validate-iteminfo-paged-inventory.py

      - name: Validate registered localization overlays
        shell: bash
        run: |
          set -euo pipefail
          components="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("TurkuazTR/line-overlays.json").read_text(encoding="utf-8"))
          print(" ".join(data["components"].keys()))
          PY
          )"
          for component in $components; do
            python3 TurkuazTR/tools/build-line-overlay-profile.py \
              --component "$component" \
              --profile full_tr \
              --output-root "/tmp/turkuaz-overlay-validation/$component"
          done

      - name: Validate registered whole-file localization overlays
        shell: bash
        run: |
          set -euo pipefail
          components="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("TurkuazTR/file-overlays.json").read_text(encoding="utf-8"))
          print(" ".join(data["components"].keys()))
          PY
          )"
          for component in $components; do
            python3 TurkuazTR/tools/build-file-overlay-profile.py \
              --component "$component" \
              --profile full_tr \
              --output-root "/tmp/turkuaz-file-overlay-validation/$component"
          done

      - name: Validate generated quest profile
        shell: bash
        run: |
          set -euo pipefail
          python3 TurkuazTR/tools/build-quest-profile.py \
            --profile full_tr \
            --output-root /tmp/turkuaz-quest-validation

      - name: Validate achievement Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate recommended quests Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --path Translation/Renewal/SystemEN/RecommendedQuests.lub \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate town info Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --path Translation/Renewal/SystemEN/Towninfo.lub \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate sign data Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --path Translation/Renewal/SystemEN/Sign_Data.lub \
            --allow-non-ascii \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate navigation data Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --path Translation/Renewal/SystemEN/Navi_Data.lub \
            --allow-non-ascii \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate quest display byte structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_questid2display_translation.py \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate OngoingQuests byte scope
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_ongoingquests_translation.py \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest
