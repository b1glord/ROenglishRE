# Dosya Yolu: /ROenglishRE/.github/workflows/turkuaz-translation-validation.yml
# Amac: Turkce localization takip araclarini ve Lua ceviri yapisini CI uzerinde dogrular
# Modul: Tool - YAML
# Version: 1.5.0
# Aciklama: Translation status, Python syntax ve achievements.lub structural validation calistirir
# Bagimli Oldugu Katman: Tool

name: Turkuaz Translation Validation

on:
  workflow_dispatch:

  push:
    branches:
      - "translation/tr"
    paths:
      - "Translation/**"
      - "TurkuazTR/**"
      - "Tools/turkuaz_translation_status.py"
      - "Tools/validate_achievement_translation.py"
      - ".github/workflows/turkuaz-translation-validation.yml"

  pull_request:
    paths:
      - "Translation/**"
      - "TurkuazTR/**"
      - "Tools/turkuaz_translation_status.py"
      - "Tools/validate_achievement_translation.py"
      - ".github/workflows/turkuaz-translation-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch translation refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/upstream/latest:refs/remotes/origin/upstream/latest' \
            '+refs/heads/translation/tr:refs/remotes/origin/translation-tr'

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Tools/turkuaz_translation_status.py \
            Tools/validate_achievement_translation.py

      - name: Report translation status
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/turkuaz_translation_status.py \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate achievement Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate recommended quests Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --path Translation/Renewal/SystemEN/RecommendedQuests.lub \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate town info Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --path Translation/Renewal/SystemEN/Towninfo.lub \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate sign data Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --path Translation/Renewal/SystemEN/Sign_Data.lub \
            --allow-non-ascii \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate navigation data Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --path Translation/Renewal/SystemEN/Navi_Data.lub \
            --allow-non-ascii \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

