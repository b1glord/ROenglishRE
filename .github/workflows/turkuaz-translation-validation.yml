# 📄 Dosya Yolu: /ROenglishRE/.github/workflows/turkuaz-translation-validation.yml
# 📌 Amac: Turkce localization takip araclarini ve generated ceviri dosyalarinin byte yapisini CI uzerinde dogrular
# 📌 Tool - YAML
# Version: 1.10.0
# Aciklama: Translation status, line/whole-file overlay source dogrulamasi, Lua structural kontrolleri, questid2display ve OngoingQuests byte-safe validation calistirir
# Bagimli Oldugu Katman: Tool

name: Turkuaz Translation Validation

on:
  workflow_dispatch:

  push:
    branches:
      - "translation/tr"
    paths:
      - "Translation/**"
      - "TurkuazTR/**"
      - "Tools/turkuaz_translation_status.py"
      - "Tools/validate_achievement_translation.py"
      - "Tools/validate_questid2display_translation.py"
      - "Tools/apply_questid2display_translation.py"
      - "Tools/validate_ongoingquests_translation.py"
      - "Tools/apply_ongoingquests_translation.py"
      - ".github/workflows/turkuaz-translation-validation.yml"

  pull_request:
    paths:
      - "Translation/**"
      - "TurkuazTR/**"
      - "Tools/turkuaz_translation_status.py"
      - "Tools/validate_achievement_translation.py"
      - "Tools/validate_questid2display_translation.py"
      - "Tools/apply_questid2display_translation.py"
      - "Tools/validate_ongoingquests_translation.py"
      - "Tools/apply_ongoingquests_translation.py"
      - ".github/workflows/turkuaz-translation-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch translation refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/upstream/latest:refs/remotes/origin/upstream/latest' \
            '+refs/heads/translation/tr:refs/remotes/origin/translation-tr'

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Tools/turkuaz_translation_status.py \
            Tools/validate_achievement_translation.py \
            Tools/validate_questid2display_translation.py \
            Tools/apply_questid2display_translation.py \
            Tools/validate_ongoingquests_translation.py \
            Tools/apply_ongoingquests_translation.py \
            TurkuazTR/tools/build-skill-profile.py \
            TurkuazTR/tools/build-line-overlay-profile.py \
            TurkuazTR/tools/build-file-overlay-profile.py \
            TurkuazTR/tools/extract-skillinfolist-pending.py \
            TurkuazTR/tools/extract-skilldescript-pending.py

      - name: Report translation status
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/turkuaz_translation_status.py \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate registered localization overlays
        shell: bash
        run: |
          set -euo pipefail
          components="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("TurkuazTR/line-overlays.json").read_text(encoding="utf-8"))
          print(" ".join(data["components"].keys()))
          PY
          )"
          for component in $components; do
            python3 TurkuazTR/tools/build-line-overlay-profile.py \
              --component "$component" \
              --profile full_tr \
              --output-root "/tmp/turkuaz-overlay-validation/$component"
          done

      - name: Validate registered whole-file localization overlays
        shell: bash
        run: |
          set -euo pipefail
          components="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("TurkuazTR/file-overlays.json").read_text(encoding="utf-8"))
          print(" ".join(data["components"].keys()))
          PY
          )"
          for component in $components; do
            python3 TurkuazTR/tools/build-file-overlay-profile.py \
              --component "$component" \
              --profile full_tr \
              --output-root "/tmp/turkuaz-file-overlay-validation/$component"
          done

      - name: Validate achievement Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate recommended quests Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --path Translation/Renewal/SystemEN/RecommendedQuests.lub \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate town info Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --path Translation/Renewal/SystemEN/Towninfo.lub \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate sign data Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --path Translation/Renewal/SystemEN/Sign_Data.lub \
            --allow-non-ascii \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate navigation data Lua structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_achievement_translation.py \
            --path Translation/Renewal/SystemEN/Navi_Data.lub \
            --allow-non-ascii \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate quest display byte structure
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_questid2display_translation.py \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Validate OngoingQuests byte scope
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_ongoingquests_translation.py \
            --translation-ref HEAD \
            --upstream-ref refs/remotes/origin/upstream/latest
