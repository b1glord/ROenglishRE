# 📄 Dosya Yolu: /ROenglishRE/.github/workflows/turkuaz-ongoingquests-apply.yml
# 📌 Amac: OngoingQuests.lub Title ve Summary cevirileri icin manuel byte-safe fallback saglar
# 📌 Tool - YAML
# Version: 1.1.0
# Aciklama: Otomatik uretim merkezi generated apply workflow tarafindan yapilir; bu workflow yalnizca manuel kurtarma icindir
# Bagimli Oldugu Katman: Tool

name: Turkuaz Ongoing Quests Manual Apply

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turkuaz-translation-generated-apply-translation-tr
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout translation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: translation/tr

      - name: Fetch upstream source ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/upstream/latest:refs/remotes/origin/upstream/latest'

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Tools/apply_ongoingquests_translation.py \
            Tools/validate_ongoingquests_translation.py

      - name: Verify OngoingQuests Git attributes
        shell: bash
        run: |
          set -euo pipefail
          attr="$(git check-attr text -- Translation/Renewal/SystemEN/OngoingQuests.lub)"
          echo "$attr"
          printf '%s\n' "$attr" | grep -Fq ': text: unset'

      - name: Apply OngoingQuests Title and Summary patches
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/apply_ongoingquests_translation.py \
            --source-ref refs/remotes/origin/upstream/latest

      - name: Validate OngoingQuests byte scope
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/validate_ongoingquests_translation.py \
            --working-tree \
            --upstream-ref refs/remotes/origin/upstream/latest

      - name: Commit generated OngoingQuests
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- Translation/Renewal/SystemEN/OngoingQuests.lub)" ]; then
            echo "OngoingQuests already up to date."
            exit 0
          fi

          git config user.name "Turkuaz Translation Bot"
          git config user.email "turkuaz-translation-bot@users.noreply.github.com"

          git add Translation/Renewal/SystemEN/OngoingQuests.lub
          git commit -m "chore: apply Turkish OngoingQuests titles and summaries"
          git push origin HEAD:translation/tr
